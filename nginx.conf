events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Docker DNS resolver
    resolver 127.0.0.11 ipv6=off valid=30s;

    server {
        listen 80;
        server_name localhost;

        # User Management
        location /api/user/ {
            set $upstream_user_services user-services;
            rewrite ^/api/user/(.*)$ /$1 break;
            proxy_pass http://$upstream_user_services:7777;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Client Management
        location /api/client/ {
            set $upstream_client_services client-services;
            rewrite ^/api/client/(.*)$ /$1 break;
            proxy_pass http://$upstream_client_services:7778;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Defect Management
        location /api/defect/ {
            set $upstream_defect_services defect-services;
            rewrite ^/api/defect/(.*)$ /$1 break;
            proxy_pass http://$upstream_defect_services:7779;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Project Management
        location /api/project/ {
            set $upstream_project_services project-services;
            rewrite ^/api/project/(.*)$ /$1 break;
            proxy_pass http://$upstream_project_services:7782;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Release Management
        location /api/release/ {
            set $upstream_release_services release-services;
            rewrite ^/api/release/(.*)$ /release/$1 break;
            proxy_pass http://$upstream_release_services:7781;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Test Case Management
        location /api/testcase/ {
            set $upstream_testcase_services testcase-services;
            rewrite ^/api/testcase/(.*)$ /$1 break;
            proxy_pass http://$upstream_testcase_services:7784;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Test Suite Management
        location /api/testsuite/ {
            set $upstream_testsuite_services testsuite-services;
            rewrite ^/api/testsuite/(.*)$ /$1 break;
            proxy_pass http://$upstream_testsuite_services:7780;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check
        location /health {
            return 200 'OK';
        }
    }
}
