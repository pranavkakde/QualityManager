services:
  mainbuild:
    image: qualitymanager_mainbuild:latest
    build:
      context: .
      dockerfile: Dockerfile

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    command: start-dev
    environment:
      KC_DB: dev-file
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "9090:8080"
    networks:
      - qualitymanager-net

  client-services:
    build:
      context: .
      dockerfile: ./packages/Services/ClientManagementServices/Dockerfile
    ports:
      - "7778:7778"
    depends_on:
      - mainbuild
    env_file: .env
    networks:
      - qualitymanager-net
    environment:
      - SERVICE_NAME=client-management-services

  defect-services:
    build:
      context: .
      dockerfile: ./packages/Services/DefectManagementServices/Dockerfile
    ports:
      - "7779:7779"
    depends_on:
      - mainbuild
    env_file: .env
    networks:
      - qualitymanager-net
    environment:
      - SERVICE_NAME=defect-management-services

  project-services:
    build:
      context: .
      dockerfile: ./packages/Services/ProjectManagementServices/Dockerfile
    ports:
      - "7782:7782"
    depends_on:
      - mainbuild
    env_file: .env
    networks:
      - qualitymanager-net
    environment:
      - SERVICE_NAME=project-management-services

  release-services:
    build:
      context: .
      dockerfile: ./packages/Services/ReleaseManagementServices/Dockerfile
    ports:
      - "7781:7781"
    depends_on:
      - mainbuild
    env_file: .env
    networks:
      - qualitymanager-net
    environment:
      - SERVICE_NAME=release-management-services

  testcase-services:
    build:
      context: .
      dockerfile: ./packages/Services/TestManagementServices/Dockerfile
    ports:
      - "7784:7784"
    depends_on:
      - mainbuild
    env_file: .env
    networks:
      - qualitymanager-net
    environment:
      - SERVICE_NAME=test-management-services

  testsuite-services:
    build:
      context: .
      dockerfile: ./packages/Services/TestSuiteManagementServices/Dockerfile
    ports:
      - "7780:7780"
    depends_on:
      - mainbuild
    env_file: .env
    networks:
      - qualitymanager-net
    environment:
      - SERVICE_NAME=test-suite-management-services

  user-services:
    build:
      context: .
      dockerfile: ./packages/Services/UserManagementServices/Dockerfile
    ports:
      - "7777:7777"
    depends_on:
      - mainbuild
    env_file: .env
    networks:
      - qualitymanager-net
    environment:
      - SERVICE_NAME=user-management-services

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-services
      - client-services
      - defect-services
      - project-services
      - release-services
      - testcase-services
      - testsuite-services
    networks:
      - qualitymanager-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    command: [ "--config=/etc/otel-config.yaml" ]
    volumes:
      - ./otel-config.yaml:/etc/otel-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - loki
    networks:
      - qualitymanager-net

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - qualitymanager-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - loki
    networks:
      - qualitymanager-net

networks:
  qualitymanager-net:
    driver: bridge
